name: E2E real models

# The published GHCR images with the real detector models, end to end through the batch CLI:
# synthesised speech, a video without a face and a public-domain clip of a speaker. Images
# (~12 GB) and models (~1.6 GB) are too heavy for every pull request, so it runs on the 1st and
# 15th of each month and on demand. Only outcomes are asserted, not which verdict the models chose.
on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published image tag (latest or sha-<7-character commit>)
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: e2e-ml-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  batch:
    name: Real-model batch analysis
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEEPFAKE_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      COMPOSE: docker compose -p dfd-ml --profile core --profile auth --profile ml
      # White House weekly address of 2017-01-07 (public domain, Wikimedia Commons): one speaker
      # facing the camera, the clip of docs/reports/live-acceptance.md. The original file is
      # immutable; a changed checksum fails the run.
      FACE_URL: https://upload.wikimedia.org/wikipedia/commons/2/29/2017-01-07_President_Obama%27s_Weekly_Address.webm
      FACE_SHA256: ff269cb818d5c737d1b0a1208439f2dfdc0b04d715bce83527f55f5797349f13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the images and models
        run: |
          df -h /
          # Preinstalled toolchains this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune --all --force
          df -h /

      - name: Prepare the environment
        run: |
          if [[ ! "$DEEPFAKE_IMAGE_TAG" =~ ^(latest|sha-[0-9a-f]{7})$ ]]; then
            echo "::error::image tag must be latest or sha-<7-character commit>"
            exit 1
          fi
          # Dev realm: the batch CLI logs in as its deepfake-loadtest service account.
          sed -e 's|^# KEYCLOAK_REALM_CONFIG=.*|KEYCLOAK_REALM_CONFIG=dev/realm-export.json|' \
              -e "s|^DEEPFAKE_IMAGE_TAG=.*|DEEPFAKE_IMAGE_TAG=$DEEPFAKE_IMAGE_TAG|" .env.example > .env
          grep -qx 'KEYCLOAK_REALM_CONFIG=dev/realm-export.json' .env
          grep -qx "DEEPFAKE_IMAGE_TAG=$DEEPFAKE_IMAGE_TAG" .env
          grep -qx 'FILE_SERVICE_REPLICAS=1' .env

      - name: Pull the published images
        run: |
          $COMPOSE pull --quiet
          {
            echo "### Images ($DEEPFAKE_IMAGE_TAG)"
            $COMPOSE config --images | sort -u | while read -r image; do
              revision=$(docker image inspect --format \
                '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
              echo "- \`$image\` $revision"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Generate the media
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          mkdir -p media/fake media/real media/other "$RUNNER_TEMP/face"
          ff() { ffmpeg -hide_banner -loglevel error -y "$@"; }
          # flite output is synthetic speech, hence the fake/ folder.
          if ffmpeg -hide_banner -filters | grep -qw flite; then
            for spec in kal:wav slt:mp3 awb:flac; do
              voice=${spec%%:*}
              printf 'This recording was generated by the continuous integration pipeline of the %s. %s\n' \
                'deepfake detector' "It uses the $voice voice and lasts for several seconds." \
                > "$RUNNER_TEMP/$voice.txt"
              ff -f lavfi -i "flite=textfile=$RUNNER_TEMP/$voice.txt:voice=$voice" -ar 16000 \
                "media/fake/speech-$voice.${spec##*:}"
            done
          else
            echo "::warning::ffmpeg has no flite filter; the audio files are tones, not speech"
            for ext in wav mp3 flac; do
              ff -f lavfi -i sine=frequency=330:duration=8 -ar 16000 "media/fake/tone.$ext"
            done
          fi
          ff -f lavfi -i testsrc2=size=1280x720:rate=25:duration=10 \
            -f lavfi -i sine=frequency=440:duration=10 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest media/other/no-face.mp4
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -A "DeepfakeDetector-CI (https://github.com/$GITHUB_REPOSITORY)" \
            -o "$RUNNER_TEMP/face/address.webm" "$FACE_URL"
          echo "$FACE_SHA256  $RUNNER_TEMP/face/address.webm" | sha256sum -c -
          ff -ss 5 -t 30 -i "$RUNNER_TEMP/face/address.webm" -vf scale=-2:720 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac media/real/speaker-30s.mp4
          rm -rf "$RUNNER_TEMP/face"
          ls -lR media

      - name: Start core and auth
        run: >-
          docker compose -p dfd-ml --profile core --profile auth
          up -d --no-build --pull never --wait --wait-timeout 600

      # Not `up --wait`: a detector reports unhealthy while it downloads its models on first
      # start, and --wait gives up on the first unhealthy status.
      - name: Start the detectors and wait for their models
        run: |
          $COMPOSE up -d --no-build --pull never
          for _ in $(seq 90); do
            healthy=$($COMPOSE ps --format '{{.Health}}' video-detector audio-detector | grep -cx healthy || true)
            if [ "$healthy" = 2 ]; then
              $COMPOSE ps
              exit 0
            fi
            sleep 10
          done
          $COMPOSE ps
          echo "::error::detectors were not healthy within 15 minutes"
          exit 1

      - name: Analyse the media with the batch CLI
        run: |
          python3 tools/batch/batch_analyze.py media --labels-from-folders --timeout 900 \
            --out results.csv --metrics-out metrics.json
          python3 infra/ci/e2e_ml_outcomes.py results.csv media
          { echo '### Results'; echo '```'; cat results.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: A second run resumes with nothing to analyse
        run: |
          cp results.csv first-run.csv
          python3 tools/batch/batch_analyze.py media --labels-from-folders --out results.csv 2>&1 |
            tee resume.log
          grep -F 'do analizy: 0' resume.log
          diff <(sort first-run.csv) <(sort results.csv)

      - if: failure()
        run: $COMPOSE logs --no-color > compose.log

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ml-report
          path: |
            results.csv
            metrics.json
            resume.log
            compose.log
          if-no-files-found: ignore
          retention-days: 14

      - if: always()
        run: $COMPOSE down -v
