name: build-push

# Publishes the deployable images to GHCR after CI (tests + SonarCloud Quality Gate) passes on
# main. Every image is scanned with Trivy before it is pushed (a CRITICAL finding blocks it),
# detector images must load the model weights pinned in their models.toml, and every pushed
# image gets a signed SLSA build provenance attestation. Tags: sha-<short commit> for every build,
# latest for main only. PRs that touch an image definition build and scan it without pushing.
# Once a week main is rebuilt without the layer cache, so the apk/apt upgrade layers take the
# distribution fixes released since the last build; manual runs can ask for the same.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "*/Dockerfile"
      - "frontend/nginx/**"
      - "infra/keycloak/Dockerfile"
      - "infra/postgres/**"
      - "infra/keycloak-config-cli/**"
      - "infra/alloy/Dockerfile"
      - "*/models.toml"
      - "detector-runtime/detector_runtime/model_files.py"
      - "infra/ci/model_smoke.py"
      - ".github/workflows/build-push.yml"
  schedule:
    # Monday, before the weekly security-scan run.
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild every layer instead of reusing the build cache
        type: boolean
        default: false

permissions:
  contents: read

# Publishing is queued, never cancelled: a half-pushed set of tags is worse than a short wait.
concurrency:
  group: build-push-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.service }})
    # workflow_run fires for every CI conclusion; publish only what passed, and only from a push.
    # Manual runs publish too, so they are limited to main (schedule always runs on main).
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore signing and the attestation API for build provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, eureka-server, orchestrator, file-service, video-detector, audio-detector]
        include:
          - service: video-detector
            build-contexts: detector_runtime=./detector-runtime
            models: video
          - service: audio-detector
            build-contexts: detector_runtime=./detector-runtime
            models: audio
          - service: keycloak
            context: ./frontend
            file: ./infra/keycloak/Dockerfile
          - service: frontend
            context: ./frontend
          # Patched upstream images: published too, so Compose can pull every image it runs.
          - service: postgres
            context: ./infra/postgres
          - service: keycloak-config-cli
            context: ./infra/keycloak-config-cli
          - service: alloy
            context: ./infra/alloy
    steps:
      # workflow_run runs on the default branch head; build the commit CI actually verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # GHCR image names must be lowercase; the repo owner has an uppercase letter.
      - name: image name and tags
        id: ns
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          LATEST: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          REBUILD: ${{ github.event_name == 'schedule' || inputs.no-cache == true }}
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
            echo "short=${SHA::7}"
            echo "latest=$LATEST"
            echo "rebuild=$REBUILD"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.ns.outputs.image }}
          tags: |
            type=raw,value=sha-${{ steps.ns.outputs.short }}
            type=raw,value=latest,enable=${{ steps.ns.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      # Backend Dockerfiles are self-contained per service dir; keycloak and frontend build
      # from the frontend sources, the patched infrastructure images from infra/<image>. The image
      # is loaded locally first so it is scanned before anything is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context || format('./{0}', matrix.service) }}
          file: ${{ matrix.file || '' }}
          build-contexts: ${{ matrix.build-contexts || '' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A rebuild still refreshes the cache, so later builds start from the new layers.
          no-cache: ${{ steps.ns.outputs.rebuild == 'true' }}
          pull: ${{ steps.ns.outputs.rebuild == 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.ns.outputs.image }}:sha-${{ steps.ns.outputs.short }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          vuln-type: "os,library"
          exit-code: "0"

      # Same gate as the compose image scan: CRITICAL fails, HIGH is listed in the job summary.
      # No SARIF: security-scan.yml owns the Code Scanning categories.
      - name: reject critical vulnerabilities
        run: python3 infra/security/report.py trivy.json

      # Detector images ship without weights: publish one only if it fetches the weights pinned
      # in its models.toml, verifies their checksums and runs them once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.models
        with:
          path: models
          key: models-${{ matrix.service }}-${{ hashFiles(format('{0}/models.toml', matrix.service)) }}

      - name: load the pinned models
        if: matrix.models
        env:
          IMAGE: ${{ steps.ns.outputs.image }}:sha-${{ steps.ns.outputs.short }}
          DETECTOR: ${{ matrix.models }}
        run: |
          # Hand the cache directory to the image's own non-root user rather than opening it to all.
          mkdir -p models
          sudo chown -R "$(docker run --rm --entrypoint id "$IMAGE" -u)" models
          docker run --rm -e PYTHONPATH=/app -v "$PWD/models:/models" \
            -v "$PWD/infra/ci:/smoke:ro" "$IMAGE" python /smoke/model_smoke.py "$DETECTOR"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer is in the builder cache from the scanned build, so this only pushes it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: github.event_name != 'pull_request'
        with:
          context: ${{ matrix.context || format('./{0}', matrix.service) }}
          file: ${{ matrix.file || '' }}
          build-contexts: ${{ matrix.build-contexts || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # On a rebuild only the local layers of the scanned build may be reused, not older ones.
          cache-from: ${{ steps.ns.outputs.rebuild != 'true' && format('type=gha,scope={0}', matrix.service) || '' }}

      # Verify with: gh attestation verify oci://<image>:<tag> --owner <repo owner>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ steps.ns.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records are only available to organization-owned repositories.
          create-storage-record: false
