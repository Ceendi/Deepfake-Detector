name: build-push

# Builds the 6 backend images and pushes to GHCR. Frontend has no Dockerfile yet (nginx image is
# Osoba 2's), so it is not built here.
#
# DISABLED for now — we don't publish images yet. It only runs on manual dispatch; to enable
# automatic publishing in production, add back the `push: branches: [main]` trigger:
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            gateway,
            eureka-server,
            orchestrator,
            file-service,
            video-detector,
            audio-detector,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR image names must be lowercase; the repo owner has an uppercase letter.
      - name: image namespace
        id: ns
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.ns.outputs.repo }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Each service Dockerfile is self-contained (own mvnw / pyproject); context is the service dir.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-contexts: ${{ contains(matrix.service, '-detector') && 'detector_runtime=./detector-runtime' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
