name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: java (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, eureka-server, orchestrator, file-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Each service is its own Maven project (own mvnw, no root reactor) -> cd + ./mvnw. The
      # *ApplicationTests smoke tests are Testcontainers-backed (need the runner's Docker, like the
      # other ITs). rerunFailingTestsCount tolerates the odd Testcontainers connection flake.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.service == 'orchestrator'
        with:
          python-version: '3.12'
      - name: Install lightweight worker process fixtures
        if: matrix.service == 'orchestrator'
        run: python -m pip install --only-binary ':all:' -r audio-detector/tests/requirements-light.txt
      - name: Install ffprobe for file validation tests
        if: matrix.service == 'file-service'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: verify
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify -Dsurefire.rerunFailingTestsCount=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-java-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/*.xml
            ${{ matrix.service }}/target/site/jacoco/
            ${{ matrix.service }}/target/classes/
            ${{ matrix.service }}/target/test-classes/
          retention-days: 14

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [video-detector, audio-detector, detector-runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Pin the verified lint version so future rule changes do not break unrelated PRs.
      - name: ruff
        working-directory: ${{ matrix.service }}
        run: uvx --no-build ruff==0.16.10 check .

  detector-contract:
    name: Lightweight detector contract (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector, detector-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install only the lightweight test dependencies
        run: python -m pip install --only-binary ':all:' -r audio-detector/tests/requirements-light.txt
      - name: Verify inference wiring, publication and shared Java fixtures without checkpoints
        working-directory: ${{ matrix.service }}
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          COV_SOURCE: ${{ matrix.service == 'detector-runtime' && 'detector_runtime' || 'src' }}
        run: >-
          python -m pytest -q tests --junitxml=reports/junit.xml
          --cov="$COV_SOURCE" --cov-report=xml:reports/coverage.xml --cov-report=term
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-contract-${{ matrix.service }}
          path: ${{ matrix.service }}/reports/
          retention-days: 14

  worker-redelivery:
    name: Worker process redelivery (RabbitMQ and Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight process test dependencies
        run: python -m pip install --only-binary ':all:' -r audio-detector/tests/requirements-light.txt
      - name: Lint process fixtures
        run: pip install --only-binary ':all:' ruff==0.16.10 && ruff check tests/worker_redelivery
      - name: Kill, redeliver, confirm, cancel and degrade Redis for both detectors
        run: tests/worker_redelivery/run.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No dependency needs an install script on Linux (only macOS fsevents has one).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:ci         # Includes the SSE transport and both screen recovery regressions.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-frontend
          path: |
            frontend/reports/
            frontend/coverage/
          retention-days: 14
      - run: npm run build
      # Keep audit blocking, but execute regressions even when an unrelated advisory is published.
      - run: npm audit --audit-level=high

  dependencies:
    name: Application dependency vulnerabilities
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Populate Maven resolution cache before Trivy
        run: |
          for service in gateway eureka-server orchestrator file-service; do
            (cd "$service" && ./mvnw -B -ntp -DskipTests dependency:resolve)
          done
      - name: Report all Maven, npm and Python lockfile vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: dependencies.json
      - name: Reject fixable application vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: application-dependency-scan
          path: dependencies.json
          if-no-files-found: error

  ml-compatibility:
    name: ML dependency compatibility (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install native dependency build and runtime libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1 libglib2.0-0 libxcb1 ffmpeg
      - name: Install the frozen CPU dependency graph
        # training/tests needs the audio "training" extra; video-detector has no extras.
        run: uv sync --frozen --all-extras
      # pytest-cov is a CI-only overlay; it is not part of the locked runtime graph.
      - name: Run consumer and extraction regressions
        run: >-
          uv run --frozen --with 'pytest-cov>=7,<8' python -m pytest -q tests
          --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term
      # Appends to the coverage above: these tests load the real runtime models (src/models).
      - name: Exercise offline model checkpoints and gradients
        run: >-
          uv run --frozen --with 'pytest-cov>=7,<8' python -m pytest -q training/tests
          --junitxml=reports/junit-training.xml --cov=src --cov-append
          --cov-report=xml:reports/coverage.xml --cov-report=term
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-ml-${{ matrix.service }}
          path: ${{ matrix.service }}/reports/
          retention-days: 14

  detector-images:
    name: Detector image security and compatibility (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the complete detector image
        run: docker build --build-context detector_runtime=detector-runtime --tag "detector-security:$SERVICE" "$SERVICE"
      - name: Test CPU imports, consumers, checkpoints and ONNX without network
        run: scripts/check-detector-image.sh "$SERVICE" "detector-security:$SERVICE"
      - name: Report all installed OS and Python vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: detector-security:${{ matrix.service }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: detector-image.json
      - name: Reject fixable detector image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: detector-security:${{ matrix.service }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: detector-image-scan-${{ matrix.service }}
          path: detector-image.json
          if-no-files-found: error

  test-report:
    name: Test report
    needs: [java, detector-contract, frontend, ml-compatibility]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
      - name: Publish JUnit results in the run summary
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          # Surefire and pytest/vitest JUnit files only; coverage XML lives in the same artifacts.
          report_paths: |
            test-results/**/TEST-*.xml
            test-results/**/junit*.xml
          check_name: Test report
          annotate_only: true
          detailed_summary: true
          include_passed: false
          group_suite: true
          flaky_summary: true

  sonar:
    name: SonarCloud Quality Gate
    needs: [java, detector-contract, frontend, ml-compatibility]
    # Fork PRs get no SONAR_TOKEN; they still run every other check.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame data for "new code" detection
      # Restores ~/.m2 so the Java analyzer resolves dependency types (sonar.java.libraries).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-java-*
          path: java-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results-frontend
          path: frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-contract-*
          path: python-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-ml-*
          path: python-reports
      - name: Put reports where sonar-project.properties expects them
        run: |
          for service in gateway eureka-server orchestrator file-service; do
            mkdir -p "$service/target"
            cp -r "java-artifacts/test-results-java-$service/." "$service/target/"
          done
          # vitest writes lcov paths relative to frontend/; Sonar resolves them from the repo root.
          sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - name: Analyze and wait for the Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.java.libraries=/home/runner/.m2/repository/**/*.jar
            -Dsonar.java.test.libraries=/home/runner/.m2/repository/**/*.jar
            -Dsonar.qualitygate.wait=true
