name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: java (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, eureka-server, orchestrator, file-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Each service is its own Maven project (own mvnw, no root reactor) -> cd + ./mvnw. The
      # *ApplicationTests smoke tests are Testcontainers-backed (need the runner's Docker, like the
      # other ITs). rerunFailingTestsCount tolerates the odd Testcontainers connection flake.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.service == 'orchestrator'
        with:
          python-version: '3.12'
      - name: Install lightweight worker process fixtures
        if: matrix.service == 'orchestrator'
        run: python -m pip install -r audio-detector/tests/requirements-light.txt
      - name: Install ffprobe for file validation tests
        if: matrix.service == 'file-service'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: verify
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify -Dsurefire.rerunFailingTestsCount=2

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [video-detector, audio-detector, detector-runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Pin the verified lint version so future rule changes do not break unrelated PRs.
      - name: ruff
        working-directory: ${{ matrix.service }}
        run: uvx ruff==0.16.10 check .

  detector-contract:
    name: Lightweight detector contract (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector, detector-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install only the lightweight test dependencies
        run: python -m pip install -r audio-detector/tests/requirements-light.txt
      - name: Verify inference wiring, publication and shared Java fixtures without checkpoints
        working-directory: ${{ matrix.service }}
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m pytest -q tests

  worker-redelivery:
    name: Worker process redelivery (RabbitMQ and Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight process test dependencies
        run: python -m pip install -r audio-detector/tests/requirements-light.txt
      - name: Lint process fixtures
        run: pip install ruff==0.16.10 && ruff check tests/worker_redelivery
      - name: Kill, redeliver, confirm, cancel and degrade Redis for both detectors
        run: tests/worker_redelivery/run.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run        # Includes the SSE transport and both screen recovery regressions.
      - run: npm run build
      # Keep audit blocking, but execute regressions even when an unrelated advisory is published.
      - run: npm audit --audit-level=high

  dependencies:
    name: Application dependency vulnerabilities
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Populate Maven resolution cache before Trivy
        run: |
          for service in gateway eureka-server orchestrator file-service; do
            (cd "$service" && ./mvnw -B -ntp -DskipTests dependency:resolve)
          done
      - name: Report all Maven, npm and Python lockfile vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: dependencies.json
      - name: Reject fixable application vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: application-dependency-scan
          path: dependencies.json
          if-no-files-found: error

  ml-compatibility:
    name: ML dependency compatibility (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install native dependency build and runtime libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1 libglib2.0-0 libxcb1 ffmpeg
      - name: Install the frozen CPU dependency graph
        # training/tests needs the audio "training" extra; video-detector has no extras.
        run: uv sync --frozen --all-extras
      - name: Run consumer and extraction regressions
        run: uv run --frozen python -m pytest -q tests
      - name: Exercise offline model checkpoints and gradients
        run: uv run --frozen python -m pytest -q training/tests

  detector-images:
    name: Detector image security and compatibility (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [audio-detector, video-detector]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the complete detector image
        run: docker build --build-context detector_runtime=detector-runtime --tag "detector-security:$SERVICE" "$SERVICE"
      - name: Test CPU imports, consumers, checkpoints and ONNX without network
        run: scripts/check-detector-image.sh "$SERVICE" "detector-security:$SERVICE"
      - name: Report all installed OS and Python vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: detector-security:${{ matrix.service }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: detector-image.json
      - name: Reject fixable detector image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: detector-security:${{ matrix.service }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: detector-image-scan-${{ matrix.service }}
          path: detector-image.json
          if-no-files-found: error
