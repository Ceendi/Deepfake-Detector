name: Security scan (Trivy)

# Scan every explicitly named Compose image, including locally built infrastructure.
# Unaccepted CRITICAL findings block CI. HIGH findings remain visible in JSON, summaries and
# Code Scanning, including advisories without a vendor fix.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan to catch newly disclosed CVEs in pinned images.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Workflow-level: deny all by default. Each job declares its own.
permissions: {}

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          fi
          printf '%s\n' "$files" | python3 infra/ci/workflow_scope.py security-scan >> "$GITHUB_OUTPUT"

  list-images:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    # Services are stable scan identities even when image versions change.
    name: Enumerate compose images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect images from compose
        id: collect
        run: |
          # `docker compose config` interpolates ${VAR} from env. CI runners
          # don't have `.env`, so without copying it from `.env.example` Compose
          # will fail on services that have `env_file: [.env]` hardcoded.
          cp .env.example .env
          # Services sharing one image (postgres + keycloak-db) are scanned once, under the
          # alphabetically first service name, so the Code Scanning category stays stable.
          IMAGES=$(docker compose --env-file .env.example --profile '*' config --format json |
            jq -c '[.services | to_entries[] | select(.value.image != null) |
              {service: .key, image: .value.image, build: (.value.build != null)}] |
              sort_by(.service) | unique_by(.image) | sort_by(.service)')
          if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
            echo "::error::No images extracted from compose. Aborting scan." >&2
            exit 1
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" | jq -r '.[].image'

  scan-images:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && needs.list-images.result == 'success' }}
    name: Scan compose images
    needs: [changes, list-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-images.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1



      - name: Build Compose image when needed
        if: matrix.build
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          cp .env.example .env
          docker compose --env-file .env.example --profile '*' build "$SERVICE"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          vuln-type: "os,library"

      - name: Publish full scan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.service }}
          path: trivy.json
          if-no-files-found: error

      - name: Summarize findings and reject critical vulnerabilities
        run: python3 infra/security/report.py trivy.json --accepted-risks infra/security/accepted-risks.json

      - name: Run Trivy in SARIF mode (for Code Scanning)
        if: ${{ !cancelled() && hashFiles('trivy.json') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ strategy.job-index }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload SARIF to Code Scanning
        # Fork PRs get a read-only GITHUB_TOKEN (security-events: write is denied regardless of the
        # permissions block), so the SARIF upload only runs on push or same-repo PRs. The scan above
        # still runs on fork PRs; only the Code Scanning upload is skipped.
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ strategy.job-index }}.sarif
          category: trivy-compose-${{ matrix.service }}

  scan-config:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Scan compose / Dockerfile config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # warning-only

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL

      - name: Upload config SARIF to Code Scanning
        # Skip on fork PRs (read-only token can't write security-events); see scan-images job.
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  dismiss-orphaned-alerts:
    # A removed or renamed service leaves its open alerts behind forever, because no new
    # upload ever closes that category. Runs only after every scan of main succeeded, so a
    # partial run cannot look like a missing category.
    name: Close alerts from categories no longer scanned
    needs: [changes, list-images, scan-images, scan-config]
    if: ${{ success() && needs.changes.outputs.run != 'false' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Dismiss open Trivy alerts outside the current categories
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ needs.list-images.outputs.images }}
        run: |
          expected=$(jq -c '[.[] | "trivy-compose-" + .service] + ["trivy-config"]' <<<"$IMAGES")
          echo "Current categories: $expected"
          echo "### Orphaned Code Scanning alerts" >> "$GITHUB_STEP_SUMMARY"
          gh api --paginate             "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&tool_name=Trivy&per_page=100"             --jq '.[] | [.number, .most_recent_instance.category] | @tsv' |
          while IFS=$'	' read -r number category; do
            if ! jq -e --arg c "$category" 'index($c)' <<<"$expected" >/dev/null; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$number"                 -f state=dismissed -f dismissed_reason="won't fix"                 -f dismissed_comment="Category $category is no longer scanned (service removed or renamed)."                 >/dev/null
              echo "- dismissed #$number ($category)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

  generate-sbom:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  security-ok:
    name: security-ok
    if: always()
    needs: [changes, list-images, scan-images, scan-config, dismiss-orphaned-alerts, generate-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 infra/ci/check_jobs.py <<< "$NEEDS"
