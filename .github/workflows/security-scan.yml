name: Security scan (Trivy)

# Scan every explicitly named Compose image, including locally built infrastructure.
# CRITICAL findings block CI. HIGH findings remain visible in JSON, summaries and
# Code Scanning, including advisories without a vendor fix.

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "infra/keycloak-config-cli/**"
      - "infra/security/**"
      - ".github/workflows/security-scan.yml"
  push:
    branches: [main]
  schedule:
    # Weekly re-scan to catch newly disclosed CVEs in pinned images.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Workflow-level: deny all by default. Each job declares its own.
permissions: {}

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-images:
    # Services are stable scan identities even when image versions change.
    name: Enumerate compose images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect images from compose
        id: collect
        run: |
          # `docker compose config` interpolates ${VAR} from env. CI runners
          # don't have `.env`, so without copying it from `.env.example` Compose
          # will fail on services that have `env_file: [.env]` hardcoded.
          cp .env.example .env
          IMAGES=$(docker compose --env-file .env.example --profile '*' config --format json |
            jq -c '[.services | to_entries[] | select(.value.image != null) |
              {service: .key, image: .value.image, build: (.value.build != null)}] | unique_by(.image)')
          if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
            echo "::error::No images extracted from compose. Aborting scan." >&2
            exit 1
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" | jq -r '.[].image'

  scan-images:
    name: Scan compose images
    needs: list-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-images.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1



      - name: Build infrastructure image when needed
        if: matrix.build
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          cp .env.example .env
          docker compose --env-file .env.example --profile '*' build "$SERVICE"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          vuln-type: "os,library"

      - name: Publish full scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.service }}
          path: trivy.json
          if-no-files-found: error

      - name: Summarize findings and reject critical vulnerabilities
        run: python3 infra/security/report.py trivy.json

      - name: Run Trivy in SARIF mode (for Code Scanning)
        if: ${{ !cancelled() && hashFiles('trivy.json') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ strategy.job-index }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload SARIF to Code Scanning
        # Fork PRs get a read-only GITHUB_TOKEN (security-events: write is denied regardless of the
        # permissions block), so the SARIF upload only runs on push or same-repo PRs. The scan above
        # still runs on fork PRs; only the Code Scanning upload is skipped.
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ strategy.job-index }}.sarif
          category: trivy-compose-${{ matrix.service }}

  scan-config:
    name: Scan compose / Dockerfile config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # warning-only

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL

      - name: Upload config SARIF to Code Scanning
        # Skip on fork PRs (read-only token can't write security-events); see scan-images job.
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
