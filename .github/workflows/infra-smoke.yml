name: Infrastructure smoke

on:
  pull_request:
    paths:
      - gateway/**
      - eureka-server/**
      - file-service/**
      - orchestrator/**
      - docker-compose.yml
      - .env.example
      - infra/seaweedfs/**
      - infra/tempo/**
      - infra/tests/**
      - infra/keycloak/**
      - infra/keycloak-config-cli/**
      - infra/postgres/**
      - .github/workflows/infra-smoke.yml
  push:
    branches: [main]
    paths:
      - gateway/**
      - eureka-server/**
      - file-service/**
      - orchestrator/**
      - docker-compose.yml
      - .env.example
      - infra/seaweedfs/**
      - infra/tempo/**
      - infra/tests/**
      - infra/keycloak/**
      - infra/keycloak-config-cli/**
      - infra/postgres/**
      - .github/workflows/infra-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tempo:
    name: Tempo ingest and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/tests/test_tempo.py

  keycloak:
    name: Keycloak import and password reset security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/tests/test_keycloak.py
      - run: python3 infra/tests/test_security_report.py

  discovery:
    name: Discovery isolation and gateway routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/tests/test_discovery.py

  analysis-file-ownership:
    name: Authorized analysis input and canonical task key
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/tests/test_analysis_file_ownership.py

  s3-configuration:
    name: S3 credential rendering and signed requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/tests/test_s3_configuration.py

  orchestrator-verify:
    name: Manual orchestrator fault acceptance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lightweight worker process fixtures
        run: python -m pip install -r audio-detector/tests/requirements-light.txt
      - name: Verify orchestrator and isolated fault fixtures
        working-directory: orchestrator
        run: ./mvnw -B verify
