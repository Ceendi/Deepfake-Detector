name: Infrastructure smoke

on:
  pull_request:
    paths:
      - gateway/**
      - eureka-server/**
      - file-service/**
      - orchestrator/**
      - docker-compose.yml
      - .github/dependabot.yml
      - .github/workflows/build-push.yml
      - .github/workflows/security-scan.yml
      - .env.example
      - infra/rabbitmq/**
      - infra/security/**
      - infra/alloy/**
      - infra/loki/**
      - infra/grafana/**
      - frontend/src/keycloak-theme/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vite.config.ts
      - frontend/src/styles/**
      - frontend/src/index.tsx
      - .github/workflows/ci.yml
      - infra/seaweedfs/**
      - infra/tempo/**
      - infra/tests/**
      - infra/keycloak/**
      - infra/keycloak-config-cli/**
      - infra/postgres/**
      - infra/prometheus/**
      - tests/live/**
      - load-tests/bench/**
      - .github/workflows/infra-smoke.yml
  push:
    branches: [main]
    paths:
      - gateway/**
      - eureka-server/**
      - file-service/**
      - orchestrator/**
      - docker-compose.yml
      - .github/dependabot.yml
      - .github/workflows/build-push.yml
      - .github/workflows/security-scan.yml
      - .env.example
      - infra/rabbitmq/**
      - infra/security/**
      - infra/alloy/**
      - infra/loki/**
      - infra/grafana/**
      - frontend/src/keycloak-theme/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vite.config.ts
      - frontend/src/styles/**
      - frontend/src/index.tsx
      - .github/workflows/ci.yml
      - infra/seaweedfs/**
      - infra/tempo/**
      - infra/tests/**
      - infra/keycloak/**
      - infra/keycloak-config-cli/**
      - infra/postgres/**
      - infra/prometheus/**
      - tests/live/**
      - load-tests/bench/**
      - .github/workflows/infra-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  monitoring-configuration:
    name: Monitoring configuration and hardened startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_ci_reliability.py
      - run: python3 infra/tests/test_java_platform.py
      - run: python3 infra/tests/test_live_acceptance.py
      - run: python3 infra/tests/test_test_ports.py
      - run: python3 infra/tests/test_monitoring_configuration.py

  observability-configuration:
    name: Observability overrides, dashboard and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_observability_configuration.py

  core-reliability:
    name: Core restart, persistence and replica monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_core_reliability.py

  tempo:
    name: Tempo ingest and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_tempo.py

  keycloak:
    name: Keycloak import and password reset security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_keycloak.py
      - run: python3 infra/tests/test_security_report.py
      - run: python3 infra/tests/test_security_configuration.py

  discovery:
    name: Discovery isolation and gateway routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_discovery.py

  analysis-file-ownership:
    name: Authorized analysis input and canonical task key
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_analysis_file_ownership.py

  s3-configuration:
    name: S3 credential rendering and signed requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_s3_configuration.py

  rabbitmq-users:
    name: Least-privilege RabbitMQ users
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_rabbitmq_users.py

  orchestrator-verify:
    name: Manual orchestrator fault acceptance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight worker process fixtures
        run: python -m pip install -r audio-detector/tests/requirements-light.txt
      - name: Verify orchestrator and isolated fault fixtures
        working-directory: orchestrator
        run: ./mvnw -B verify
