name: Infrastructure smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          fi
          printf '%s\n' "$files" | python3 infra/ci/workflow_scope.py infra-smoke >> "$GITHUB_OUTPUT"

  monitoring-configuration:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Monitoring configuration and hardened startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_ci_reliability.py
      - run: python3 infra/tests/test_ci_scope.py
      - run: python3 infra/tests/test_java_platform.py
      - run: python3 infra/tests/test_live_acceptance.py
      - run: python3 infra/tests/test_test_ports.py
      - run: python3 infra/tests/test_monitoring_configuration.py
      - run: python3 infra/tests/test_compose_images.py
      - run: python3 infra/tests/test_e2e_ml.py

  observability-configuration:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Observability overrides, dashboard and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_observability_configuration.py

  core-reliability:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Core restart, persistence and replica monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_core_reliability.py

  tempo:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Tempo ingest and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_tempo.py

  keycloak:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Keycloak import and password reset security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_keycloak.py
      - run: python3 infra/tests/test_security_report.py
      - run: python3 infra/tests/test_security_configuration.py

  discovery:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Discovery isolation and gateway routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_discovery.py

  analysis-file-ownership:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Authorized analysis input and canonical task key
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_analysis_file_ownership.py

  s3-configuration:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: S3 credential rendering and signed requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_s3_configuration.py

  rabbitmq-users:
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    needs: changes
    name: Least-privilege RabbitMQ users
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 infra/tests/test_rabbitmq_users.py

  orchestrator-verify:
    needs: changes
    name: Manual orchestrator fault acceptance
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight worker process fixtures
        run: |
          python -m pip install --only-binary ':all:' --require-hashes -r audio-detector/tests/requirements-light.txt
          python infra/ci/link_detector_runtime.py
      - name: Verify orchestrator and isolated fault fixtures
        working-directory: orchestrator
        run: ./mvnw -B verify

  infra-ok:
    name: infra-ok
    if: always()
    needs: [changes, monitoring-configuration, observability-configuration, core-reliability, tempo, keycloak, discovery, analysis-file-ownership, s3-configuration, rabbitmq-users, orchestrator-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 infra/ci/check_jobs.py <<< "$NEEDS"
