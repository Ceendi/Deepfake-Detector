name: E2E

# Playwright against the real core + auth stack (Keycloak login, gateway, orchestrator,
# file-service). Detectors need models that are not in the repository, so analyses stay active;
# the per-user limits are raised for the throwaway stack instead of changing product defaults.
# `playwright` is a required check, so the workflow always runs; a path filter on the trigger would
# leave the check pending forever on PRs that do not touch the app. Unrelated PRs skip the job
# instead, and a skipped required job counts as passed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          APP_PATHS: >-
            ^(frontend|gateway|orchestrator|file-service|eureka-server)/|^infra/(keycloak|keycloak-config-cli|postgres|rabbitmq|seaweedfs)/|^docker-compose\.yml$|^\.env\.example$|^\.github/workflows/e2e\.yml$
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If the file list cannot be read, run E2E rather than silently skipping it.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq "$APP_PATHS" <<<"$files"; then app=true; else app=false; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  playwright:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -p dfd-e2e --env-file e2e.env --profile core --profile auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare a disposable environment
        run: |
          # Analyses never finish without detectors; uploads come in bursts from parallel tests.
          sed -e 's/^BACKPRESSURE_MAX_INFLIGHT_PER_USER=.*/BACKPRESSURE_MAX_INFLIGHT_PER_USER=100/' \
              -e 's/^UPLOAD_MAX_CONCURRENT_PER_USER=.*/UPLOAD_MAX_CONCURRENT_PER_USER=4/' \
              -e 's|^# KEYCLOAK_REALM_CONFIG=.*|KEYCLOAK_REALM_CONFIG=dev/realm-export.json|' \
              -e 's/^# UPLOAD_RL_BURST=.*/UPLOAD_RL_BURST=6000/' .env.example > e2e.env
          grep -qx 'BACKPRESSURE_MAX_INFLIGHT_PER_USER=100' e2e.env
          grep -qx 'UPLOAD_MAX_CONCURRENT_PER_USER=4' e2e.env
          grep -qx 'KEYCLOAK_REALM_CONFIG=dev/realm-export.json' e2e.env
          grep -qx 'UPLOAD_RL_BURST=6000' e2e.env
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && cp .env.example .env
        working-directory: frontend
      - name: Start core and auth
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: frontend
      - run: ./node_modules/.bin/playwright test --project=chromium
        working-directory: frontend
      - if: failure()
        run: $COMPOSE logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
          retention-days: 14
      - name: Publish E2E results in the run summary
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: frontend/reports/e2e-junit.xml
          check_name: E2E test report
          annotate_only: true
          detailed_summary: true
          include_passed: false
      - if: always()
        run: $COMPOSE down -v
