# Dependabot automatically opens PRs when pinned tags / actions have newer
# versions. The compose tags are pinned to patch level (e.g. postgres:17.9-alpine);
# Dependabot bumps them, the security-scan workflow re-runs against the new
# tag because it reads from compose dynamically, so dev and scan stay in lockstep.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-compose:
        patterns:
          - "*"
    # Python minor bumps (incl. release candidates like 3.15.0rc3) are deliberate; patches stay automatic.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Locally built images (bases are tracked in their Dockerfiles) do not exist on Docker Hub.
      - dependency-name: "deepfake-*"
    commit-message:
      prefix: "build(infra)"
    labels:
      - "dependencies"
      - "infra"

  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(gateway)"
    labels:
      - "dependencies"
      - "infra"

  - package-ecosystem: docker
    directory: /eureka-server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(eureka-server)"
    labels:
      - "dependencies"
      - "infra"

  - package-ecosystem: docker
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(orchestrator)"
    labels:
      - "dependencies"
      - "infra"

  - package-ecosystem: docker
    directory: /file-service
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(file-service)"
    labels:
      - "dependencies"
      - "infra"

  # Bases of the locally built infra images (deepfake-* tags in compose, ignored above).
  - package-ecosystem: docker
    directories:
      - /infra/postgres
      - /infra/keycloak-config-cli
      - /infra/alloy
    schedule:
      interval: weekly
      day: monday
    groups:
      infra-images:
        patterns:
          - "*"
    # keycloak-config-cli builds and runs on Java 21; a JDK move must change both stages together.
    # The maven builder tag encodes the JDK as a suffix that update-types cannot classify.
    ignore:
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(infra)"
    labels:
      - "dependencies"
      - "infra"

  - package-ecosystem: docker
    directories:
      - /video-detector
      - /audio-detector
    schedule:
      interval: weekly
      day: monday
    # An Ubuntu release changes the system Python the detectors run on, and 24.10-style tags are
    # short-lived non-LTS releases; move between LTS versions deliberately. The version range also
    # covers digest refreshes, which Dependabot has written with a newer tag. 24.04 digests still update.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ubuntu"
        versions: [">= 24.05"]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, infra]

  - package-ecosystem: uv
    directories:
      - /video-detector
      - /audio-detector
      - /detector-runtime
    schedule:
      interval: weekly
      day: monday
    # CI-only pip file; its `-e ./detector-runtime` is relative to the repo root, not the file.
    exclude-paths:
      - "**/requirements-light.txt"
    groups:
      python:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]

  - package-ecosystem: maven
    directories:
      - /gateway
      - /eureka-server
      - /orchestrator
      - /file-service
    schedule:
      interval: weekly
      day: monday
    groups:
      maven:
        update-types: ["minor", "patch"]
    # Spring Boot minors need a matching Spring Cloud release train and springdoc line, so the
    # framework moves deliberately in all four services at once; majors are migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(frontend)"
    labels: [dependencies]
