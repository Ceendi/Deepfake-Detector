# Dependabot automatically opens PRs when pinned tags / actions have newer
# versions. The compose tags are pinned to patch level (e.g. postgres:17.9-alpine);
# Dependabot bumps them, the security-scan workflow re-runs against the new
# tag because it reads from compose dynamically, so dev and scan stay in lockstep.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

# All version updates arrive as one weekly PR: with "branches must be up to date" protection,
# separate PRs would each need a rebase and a full CI run in turn. Majors and deliberate pins stay
# in each ecosystem's ignore list; security updates still arrive immediately as their own PRs.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # Python minor bumps (incl. release candidates like 3.15.0rc3) are deliberate; patches stay automatic.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Locally built images (bases are tracked in their Dockerfiles) do not exist on Docker Hub.
      - dependency-name: "ghcr.io/ceendi/deepfake-detector/*"

  - package-ecosystem: docker
    directory: /gateway
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /eureka-server
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /orchestrator
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /file-service
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: pip
    directories:
      - /infra/ci
      - /infra/ci/test-requirements
    patterns: ["*"]
    multi-ecosystem-group: weekly

  # Bases of the locally built infrastructure images (GHCR tags in Compose, ignored above).
  - package-ecosystem: docker
    directories:
      - /infra/postgres
      - /infra/keycloak
      - /infra/keycloak-config-cli
      - /infra/alloy
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # keycloak-config-cli builds and runs on Java 21; a JDK move must change both stages together.
    # The maven builder tag encodes the JDK as a suffix that update-types cannot classify.
    ignore:
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /video-detector
      - /audio-detector
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # An Ubuntu release changes the system Python the detectors run on, and 24.10-style tags are
    # short-lived non-LTS releases; move between LTS versions deliberately. The version range also
    # covers digest refreshes, which Dependabot has written with a newer tag. 24.04 digests still update.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ubuntu"
        versions: [">= 24.05"]

  - package-ecosystem: uv
    directories:
      - /video-detector
      - /audio-detector
      - /detector-runtime
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # Images install the frozen uv.lock; increase updates exact project pins together with the lock.
    versioning-strategy: increase
    # Inference runtimes change scores and latency; bump them deliberately with accuracy and
    # latency measurements (AGENTS.md quality targets).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "onnxruntime"
      - dependency-name: "onnx"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      - dependency-name: "transformers"
      - dependency-name: "timm"
      - dependency-name: "insightface"

  - package-ecosystem: maven
    directories:
      - /gateway
      - /eureka-server
      - /orchestrator
      - /file-service
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # Spring Boot minors need a matching Spring Cloud release train and springdoc line, so the
    # framework moves deliberately in all four services at once; majors are migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
