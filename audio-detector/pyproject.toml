[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfake-audio-detector"
version = "0.1.0"
description = "Audio Detector Service for Deepfakes"
requires-python = ">=3.12"
dependencies = [
    "deepfake-detector-runtime",
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pika==1.4.4",
    "pydantic==2.14.1",
    "prometheus-client==0.26.0",
    "structlog==25.5.0",
    "boto3==1.43.113",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "soundfile==0.14.0",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchvision==0.27.0",
    "onnxruntime==1.26.0",
    "redis==8.1.0",
    "matplotlib==3.11.2",
    # Patched runtime transitive dependencies.
    "fsspec==2026.9.0",
    "anyio==4.15.1",
    "pillow==12.3.0",
    "starlette==1.8.0",
    "urllib3==2.8.0",
]

# Training, evaluation and ONNX export only; the detector image installs [project.dependencies].
[project.optional-dependencies]
training = [
    "lightning==2.6.6",
    "audiomentations[extras]>=0.37",
    "librosa>=0.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "onnx",
    "transformers==5.18.0",
    "pyroomacoustics>=0.10.1",
    "seaborn>=0.13.2",
    # Minimum patched releases for training transitive dependencies.
    "aiohttp>=3.14.3",
    "msgpack>=1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Consumer tests stub src.inference, so they run without the ML stack:
#   uv pip install pika structlog boto3 redis prometheus-client opentelemetry-sdk pytest && pytest tests
[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
deepfake-detector-runtime = { path = "../detector-runtime" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[tool.ruff]
target-version = "py312"
line-length = 100
