[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfake-video-detector"
version = "0.1.0"
description = "Video Detector Service for Deepfakes"
requires-python = ">=3.12"
dependencies = [
    "deepfake-detector-runtime",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pika==1.4.4",
    "pydantic==2.14.1",
    "prometheus-client==0.26.0",
    "structlog==25.5.0",
    "boto3==1.42.97",
    "redis==8.1.0",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    # --- ML stack (inferencja CPU-only: ONNX CPUExecutionProvider + torch map_location=cpu) ---
    "torch==2.12.0",
    "torchvision==0.27.0",
    "lightning==2.6.6",
    "timm==1.0.30",
    "onnxruntime==1.25.1",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.4",
    "anyio==4.15.1",
    "aiohttp==3.14.5",
    "pillow==12.3.0",
    "msgpack==1.2.3",
    "starlette==1.7.0",
    "urllib3==2.8.0",
    "insightface==2.1",   # RetinaFace buffalo_l (detection-only) + norm_crop
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Consumer tests stub src.inference, so they run without the ML stack:
#   uv pip install pika structlog boto3 redis prometheus-client opentelemetry-sdk fastapi pytest && pytest tests
[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
deepfake-detector-runtime = { path = "../detector-runtime" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
