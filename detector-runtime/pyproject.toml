[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfake-detector-runtime"
version = "0.1.0"
description = "Shared synchronous AMQP runtime for the deepfake detectors"
requires-python = ">=3.12"
dependencies = [
    "pika==1.4.*",
    "structlog==25.*",
    "boto3==1.42.*",
    "redis",
    "opentelemetry-api>=1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["detector_runtime"]

[dependency-groups]
dev = ["pytest>=8", "opentelemetry-sdk>=1.30"]

[tool.ruff]
target-version = "py312"
line-length = 100
