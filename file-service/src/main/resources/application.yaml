server:
  port:
    8081
  tomcat:
    # Upload limits reject before the body is read. Tomcat drains only 2 MB by default and then
    # resets the connection, so the gateway (still sending) reports 500 instead of the 429/503.
    max-swallow-size: 501MB
spring:
  application:
    name: file-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri validates the iss claim (public URL in the token); jwk-set-uri is where
          # keys are actually fetched (internal URL in docker, so no host-gateway hacks needed).
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/deepfake}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/deepfake/protocol/openid-connect/certs}
  # Own database + own least-privilege user (database-per-service), separate from the
  # orchestrator's DB in the same Postgres container — so each service has its own
  # flyway_schema_history and no cross-service SQL access.
  datasource:
    url: jdbc:postgresql://postgres:5432/${FILE_SERVICE_DB_NAME:fileservice}
    username: ${FILE_SERVICE_DB_USER}
    password: ${FILE_SERVICE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      location: ${UPLOAD_SPOOL_DIRECTORY:${java.io.tmpdir}/deepfake-uploads}
      max-file-size: 500MB
      # Keep 1 MiB for multipart boundaries and headers; the file itself remains capped at 500 MiB.
      max-request-size: 501MB
eureka:
  instance:
    # D4: register the docker-network IP, not the auto container-ID hostname (not DNS-resolvable),
    # so the Gateway LoadBalancer can reach each replica. Default instance-id stays unique per replica.
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/}
storage:
  quota-bytes: ${STORAGE_QUOTA_BYTES:5368709120}
  endpoint: http://seaweedfs:8333
  # Browser-reachable host baked into presigned URLs (the internal endpoint is not resolvable
  # outside the docker network). Dev: localhost:8333; prod: public domain / via gateway.
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:8333}
  region: us-east-1
  access-key: ${S3_FILE_SERVICE_KEY}
  secret-key: ${S3_FILE_SERVICE_SECRET}
  bucket: deepfake-uploads
  cleanup:
    unused-retention: ${UPLOAD_UNUSED_RETENTION:7d}
    # Lifecycle sweep (S3CleanupService): purge soft-deleted files past retention, reclaim
    # orphaned objects older than orphan-min-age (covers the S3-put-then-row-commit race).
    retention-hours: ${FILE_CLEANUP_RETENTION_HOURS:72}
    orphan-min-age-hours: ${FILE_CLEANUP_ORPHAN_MIN_AGE_HOURS:24}
    scan-interval-ms: ${FILE_CLEANUP_SCAN_INTERVAL_MS:3600000}
    initial-delay-ms: 60000
media:
  max-pixels: ${MEDIA_MAX_PIXELS:8294400}
  max-duration-seconds: ${MEDIA_MAX_DURATION_SECONDS:1800}
  probe:
    # Retained stdout budget, enforced while reading; arbitrary upload tags are excluded.
    max-output-bytes: ${MEDIA_PROBE_MAX_OUTPUT_BYTES:65536}
upload:
  max-concurrent: ${UPLOAD_MAX_CONCURRENT:4}
  max-concurrent-per-user: ${UPLOAD_MAX_CONCURRENT_PER_USER:2}
security:
  jwt:
    allowed-clients: ${JWT_ALLOWED_CLIENTS:deepfake-web,deepfake-cli,deepfake-loadtest}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 10m
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  tracing:
    sampling:
      probability: 1.0          # dev: sample everything; prod → ~0.1
    # Gate EXPORT only — see orchestrator/application.yaml for the rationale.
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics ship via Prometheus scrape (/actuator/prometheus, D3). The OTLP meter registry
        # arrives transitively with the OpenTelemetry starter and is unused here — disabled so it
        # doesn't push to (and fail against) a non-existent OTLP collector every minute.
        enabled: false
logging:
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n'
