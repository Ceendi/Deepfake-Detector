# SonarCloud analysis of the whole monorepo (one project, one Quality Gate).
# CI (.github/workflows/ci.yml, job "sonar") downloads the test artifacts into the paths below.
sonar.organization=ceendi
sonar.projectKey=Ceendi_Deepfake-Detector
sonar.projectName=DeepfakeDetector
sonar.sourceEncoding=UTF-8

# Everything is source (services, training, infra scripts, Dockerfiles, CI workflows) except
# tests, docs, binaries and the CI report downloads.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/src/test/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**,\
  frontend/tests/**,\
  audio-detector/tests/**,\
  audio-detector/training/tests/**,\
  video-detector/tests/**,\
  video-detector/training/tests/**,\
  detector-runtime/tests/**,\
  infra/tests/**,\
  tests/**
sonar.exclusions=\
  **/src/test/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**,\
  frontend/tests/**,\
  audio-detector/tests/**,\
  audio-detector/training/tests/**,\
  video-detector/tests/**,\
  video-detector/training/tests/**,\
  detector-runtime/tests/**,\
  infra/tests/**,\
  tests/**,\
  docs/**,\
  load-tests/**,\
  frontend/src/api/generated/**,\
  frontend/coverage/**,\
  frontend/reports/**,\
  **/target/**,\
  java-artifacts/**,\
  python-reports/**,\
  **/*.png,**/*.jpg,**/*.svg,**/*.ico,**/*.woff2
# Offline training and operator scripts are exercised manually, not by the unit test suites.
sonar.coverage.exclusions=\
  audio-detector/training/**,\
  video-detector/training/**,\
  audio-detector/eval.py,\
  infra/**,\
  scripts/**
# Test-only requirement files use repo-root relative paths that the dependency scanner cannot
# install; production Python dependencies come from the uv.lock files.
sonar.sca.exclusions=\
  audio-detector/tests/requirements-light.txt,\
  video-detector/training/requirements.txt

# Java: compiled classes from the java matrix job, dependency jars from the restored Maven cache.
sonar.java.source=25
sonar.java.binaries=\
  gateway/target/classes,\
  eureka-server/target/classes,\
  orchestrator/target/classes,\
  file-service/target/classes
sonar.java.test.binaries=\
  gateway/target/test-classes,\
  eureka-server/target/test-classes,\
  orchestrator/target/test-classes,\
  file-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=*/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=\
  gateway/target/surefire-reports,\
  eureka-server/target/surefire-reports,\
  orchestrator/target/surefire-reports,\
  file-service/target/surefire-reports

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.python.version=3.12
sonar.python.coverage.reportPaths=python-reports/**/coverage.xml

# Reviewed exceptions. Each one is a deliberate decision, kept here so it is reviewed in a PR.
sonar.issue.ignore.multicriteria=cli,clieval,clinfra,augment,perm,upload,migration,loginfocus,testreqs,mlsync,detbuild,runtimelock,publish
# Training, evaluation and infra entry points take file paths from the operator running them.
sonar.issue.ignore.multicriteria.cli.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cli.resourceKey=**/training/**
sonar.issue.ignore.multicriteria.clieval.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.clieval.resourceKey=audio-detector/eval.py
sonar.issue.ignore.multicriteria.clinfra.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.clinfra.resourceKey=infra/**
# Data augmentation and dataset shuffling, not a security context.
sonar.issue.ignore.multicriteria.augment.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.augment.resourceKey=**/training/**
# The rendered SeaweedFS config must stay readable by the SeaweedFS process (0644).
sonar.issue.ignore.multicriteria.perm.ruleKey=python:S2612
sonar.issue.ignore.multicriteria.perm.resourceKey=infra/seaweedfs/render_config.py
# 500 MB uploads are part of the REST contract (docs/contracts); limits are enforced in file-service.
sonar.issue.ignore.multicriteria.upload.ruleKey=java:S5693
sonar.issue.ignore.multicriteria.upload.resourceKey=file-service/src/main/resources/application.yaml
# Backfill of a new column over every row; applied migrations are immutable.
sonar.issue.ignore.multicriteria.migration.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.migration.resourceKey=file-service/src/main/resources/db/migration/V3__unused_upload_retention.sql
# The login page exists only to type credentials; Keycloak's own theme focuses the username too.
sonar.issue.ignore.multicriteria.loginfocus.ruleKey=typescript:S9379
sonar.issue.ignore.multicriteria.loginfocus.resourceKey=frontend/src/keycloak-theme/login/pages/Login.tsx
# CI-only test fixtures: version ranges in requirements-light.txt, wheels only, Dependabot-updated.
sonar.issue.ignore.multicriteria.testreqs.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.testreqs.resourceKey=.github/workflows/*.yml
# The frozen detector graphs include insightface, which ships only a source distribution.
sonar.issue.ignore.multicriteria.mlsync.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.mlsync.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.detbuild.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.detbuild.resourceKey=*-detector/Dockerfile
# detector-runtime is a library; its versions are locked in each detector's uv.lock.
sonar.issue.ignore.multicriteria.runtimelock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.runtimelock.resourceKey=detector-runtime/pyproject.toml
# build-push checks out a commit only after CI succeeded for a push to main of this repository;
# fork pull requests never reach the publishing path.
sonar.issue.ignore.multicriteria.publish.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.publish.resourceKey=.github/workflows/build-push.yml
