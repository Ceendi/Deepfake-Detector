# SonarCloud analysis of the whole monorepo (one project, one Quality Gate).
# CI (.github/workflows/ci.yml, job "sonar") downloads the test artifacts into the paths below.
sonar.organization=ceendi
sonar.projectKey=Ceendi_Deepfake-Detector
sonar.projectName=DeepfakeDetector
sonar.sourceEncoding=UTF-8

# Everything is source (services, training, infra scripts, Dockerfiles, CI workflows) except
# tests, docs, binaries and the CI report downloads.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/src/test/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**,\
  frontend/tests/**,\
  audio-detector/tests/**,\
  audio-detector/training/tests/**,\
  video-detector/tests/**,\
  video-detector/training/tests/**,\
  detector-runtime/tests/**,\
  tests/**
sonar.exclusions=\
  **/src/test/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**,\
  frontend/tests/**,\
  audio-detector/tests/**,\
  audio-detector/training/tests/**,\
  video-detector/tests/**,\
  video-detector/training/tests/**,\
  detector-runtime/tests/**,\
  tests/**,\
  docs/**,\
  load-tests/**,\
  frontend/src/api/generated/**,\
  frontend/coverage/**,\
  frontend/reports/**,\
  **/target/**,\
  java-artifacts/**,\
  python-reports/**,\
  **/*.png,**/*.jpg,**/*.svg,**/*.ico,**/*.woff2
# Offline training and operator scripts are exercised manually, not by the unit test suites.
sonar.coverage.exclusions=\
  audio-detector/training/**,\
  video-detector/training/**,\
  audio-detector/eval.py,\
  infra/**,\
  scripts/**
# Test-only requirement files use repo-root relative paths that the dependency scanner cannot
# install; production Python dependencies come from the uv.lock files.
sonar.sca.exclusions=\
  audio-detector/tests/requirements-light.txt,\
  video-detector/training/requirements.txt

# Java: compiled classes from the java matrix job, dependency jars from the restored Maven cache.
sonar.java.source=25
sonar.java.binaries=\
  gateway/target/classes,\
  eureka-server/target/classes,\
  orchestrator/target/classes,\
  file-service/target/classes
sonar.java.test.binaries=\
  gateway/target/test-classes,\
  eureka-server/target/test-classes,\
  orchestrator/target/test-classes,\
  file-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=*/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=\
  gateway/target/surefire-reports,\
  eureka-server/target/surefire-reports,\
  orchestrator/target/surefire-reports,\
  file-service/target/surefire-reports

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.python.version=3.12
sonar.python.coverage.reportPaths=python-reports/**/coverage.xml
