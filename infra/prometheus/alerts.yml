groups:
  - name: deepfake-reliability
    rules:
      - alert: AnalysisDeadLettered
        expr: increase(analyses_dlq_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Analiza zakończona błędem po dead-lettering.
      - alert: AnalysisStuckRecovered
        expr: increase(analyses_stuck_recovered_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Recovery przerwało analizę po przekroczeniu czasu.
      - alert: AnalysisDeadLetterBacklog
        expr: rabbitmq_queue_messages_ready{queue=~"analysis\\..*\\.dlq|analysis\\.backend\\.quarantine"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Wiadomości oczekują w DLQ lub kwarantannie.
      - alert: ScrapeTargetDown
        expr: up{job!~"video-detector|audio-detector"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus nie może zebrać metryk usługi.
      - alert: DetectorUnavailable
        # HTTP can stay healthy while the AMQP consumer reconnects indefinitely.
        expr: |
          (
            label_replace(
              sum by (queue) (rabbitmq_queue_messages_ready{job="rabbitmq",queue=~"analysis\\.(video|audio)"}) > 0,
              "job", "$1-detector", "queue", "analysis\\.(video|audio)"
            ) unless on (job) (up{job=~"video-detector|audio-detector"} == 1)
          ) or label_replace(
            (sum by (queue) (rabbitmq_queue_messages_ready{job="rabbitmq",queue=~"analysis\\.(video|audio)"}) > 0)
            and on (queue)
            (sum by (queue) (rabbitmq_queue_consumers{job="rabbitmq",queue=~"analysis\\.(video|audio)"}) == 0),
            "job", "$1-detector", "queue", "analysis\\.(video|audio)"
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Brak dostępnego detektora dla oczekujących zadań.
