global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Java services expose Micrometer metrics at /actuator/prometheus (D3). Targets are the
  # in-network service names + ports from docker-compose; they read DOWN until the service is up.
  - job_name: orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['orchestrator:8082']
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:9090']
  - job_name: file-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['file-service']
        type: A
        port: 8081
        refresh_interval: 30s

  # RabbitMQ broker metrics (rabbitmq_prometheus plugin, port 15692) — queue depth, etc.
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # DNS discovery gives each detector replica its own instance and follows Compose scaling.
  - job_name: video-detector
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['video-detector']
        type: A
        port: 8000
        refresh_interval: 30s
  - job_name: audio-detector
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['audio-detector']
        type: A
        port: 8000
        refresh_interval: 30s
