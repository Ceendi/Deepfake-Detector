# Tempo 3.x monolithic, local storage (dev); no Kafka is required.
# Java services export to the OTLP HTTP receiver at http://tempo:4318/v1/traces.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_block_duration: 5m
  wal:
    path: /var/tempo/live-store/traces

overrides:
  defaults:
    compaction:
      block_retention: 72h        # traces are heavy — shorter than logs/metrics

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Even when idle, the worker waits out this timeout on shutdown (its in-process scheduler stops
# first). The 30s default outlasts Docker's 10s stop grace; interrupted jobs are retried.
backend_worker:
  finish_on_shutdown_timeout: 5s
