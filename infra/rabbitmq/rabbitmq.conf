# Per-queue Prometheus metrics (e.g. rabbitmq_queue_messages_ready{queue="analysis.results"}).
# Default /metrics is aggregated; we have few queues, so per-object cardinality is fine.
prometheus.return_per_object_metrics = true

# Reserve memory for the Erlang runtime alongside the quorum queue WAL.
total_memory_available_override_value = 512MB
raft.wal_max_size_bytes = 67108864
