rule_files:
  - /etc/prometheus/alerts.yml
evaluation_interval: 1m
tests:
  - name: failure events and persistent outages fire
    interval: 1m
    input_series:
      - series: analyses_dlq_total
        values: 0+0x10 1+0x9
      - series: analyses_stuck_recovered_total
        values: 0+0x10 1+0x9
      - series: up{job="orchestrator",instance="orchestrator:8082"}
        values: 0+0x20
      - series: rabbitmq_queue_messages_ready{queue="analysis.results.dlq"}
        values: 1+0x20
      - series: rabbitmq_queue_messages_ready{queue="analysis.backend.quarantine"}
        values: 1+0x20
    alert_rule_test:
      - eval_time: 11m
        alertname: AnalysisDeadLettered
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Analiza zakończona błędem po dead-lettering.}
      - eval_time: 11m
        alertname: AnalysisStuckRecovered
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Recovery przerwało analizę po przekroczeniu czasu.}
      - eval_time: 1m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: orchestrator, instance: 'orchestrator:8082'}
            exp_annotations: {summary: Prometheus nie może zebrać metryk usługi.}
      - eval_time: 1m
        alertname: AnalysisDeadLetterBacklog
        exp_alerts: []
      - eval_time: 2m
        alertname: AnalysisDeadLetterBacklog
        exp_alerts:
          - exp_labels: {severity: warning, queue: analysis.results.dlq}
            exp_annotations: {summary: Wiadomości oczekują w DLQ lub kwarantannie.}
          - exp_labels: {severity: warning, queue: analysis.backend.quarantine}
            exp_annotations: {summary: Wiadomości oczekują w DLQ lub kwarantannie.}
  - name: healthy targets, counter restarts and brief outages do not fire
    interval: 1m
    input_series:
      - series: analyses_dlq_total
        values: 5 5 0+0x18
      - series: analyses_stuck_recovered_total
        values: 5 5 0+0x18
      - series: up{job="orchestrator",instance="orchestrator:8082"}
        values: 1 0 1+0x18
      - series: rabbitmq_queue_messages_ready{queue="analysis.results.dlq"}
        values: 0 1 0+0x18
      - series: rabbitmq_queue_messages_ready{queue="analysis.video"}
        values: 1+0x20
    alert_rule_test:
      - eval_time: 5m
        alertname: AnalysisDeadLettered
        exp_alerts: []
      - eval_time: 5m
        alertname: AnalysisStuckRecovered
        exp_alerts: []
      - eval_time: 5m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: AnalysisDeadLetterBacklog
        exp_alerts: []
  - name: alerts resolve after recovery
    interval: 1m
    input_series:
      - series: analyses_dlq_total
        values: 0 1+0x10
      - series: analyses_stuck_recovered_total
        values: 0 1+0x10
      - series: up{job="orchestrator",instance="orchestrator:8082"}
        values: 0+0x3 1+0x7
      - series: rabbitmq_queue_messages_ready{queue="analysis.audio.dlq"}
        values: 1+0x3 0+0x7
    alert_rule_test:
      - eval_time: 6m
        alertname: AnalysisDeadLettered
        exp_alerts: []
      - eval_time: 6m
        alertname: AnalysisStuckRecovered
        exp_alerts: []
      - eval_time: 6m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 6m
        alertname: AnalysisDeadLetterBacklog
        exp_alerts: []
  - name: disabled detectors without queued work stay quiet
    interval: 1m
    input_series:
      - series: up{job="video-detector",instance="video-detector:8000"}
        values: 0+0x5
      - series: up{job="audio-detector",instance="audio-detector:8000"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 0+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: missing DNS targets without queued work stay quiet
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 0+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: queued video without DNS targets fires only for video after the hold
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 2+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video.dlq"}
        values: 1+0x5
    alert_rule_test:
      - eval_time: 1m
        alertname: DetectorUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: video-detector, queue: analysis.video}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
  - name: a healthy replica suppresses only its own detector alert
    interval: 1m
    input_series:
      - series: up{job="video-detector",instance="10.0.0.1:8000"}
        values: 1+0x5
      - series: up{job="video-detector",instance="10.0.0.2:8000"}
        values: 0+0x5
      - series: up{job="audio-detector",instance="10.0.0.3:8000"}
        values: 0+0x5
      - series: up{job="audio-detector",instance="10.0.0.4:8000"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 2+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 3+0x5
    alert_rule_test:
      - eval_time: 3m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: audio-detector, queue: analysis.audio}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
  - name: audio backlog with no targets resolves when work drains
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 1+0x3 0+0x3
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: audio-detector, queue: analysis.audio}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
      - eval_time: 4m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: detector recovery resolves despite a remaining backlog
    interval: 1m
    input_series:
      - series: up{job="video-detector",instance="10.0.0.1:8000"}
        values: 0+0x3 1+0x3
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 1+0x7
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: video-detector, queue: analysis.video}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
      - eval_time: 4m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: brief outage and unrelated queues do not fire
    interval: 1m
    input_series:
      - series: up{job="audio-detector",instance="10.0.0.1:8000"}
        values: 1 0 1+0x3
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 1+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video.dlq"}
        values: 1+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.results"}
        values: 1+0x5
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: healthy HTTP with no consumer fires for both queues after the hold
    interval: 1m
    input_series:
      - series: up{job="video-detector"}
        values: 1+0x5
      - series: up{job="audio-detector"}
        values: 1+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 2+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 3+0x5
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.video"}
        values: 0+0x5
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.audio"}
        values: 0+0x5
    alert_rule_test:
      - eval_time: 1m
        alertname: DetectorUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: video-detector, queue: analysis.video}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
          - exp_labels: {severity: critical, job: audio-detector, queue: analysis.audio}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
  - name: returning consumer resolves its own job despite remaining work
    interval: 1m
    input_series:
      - series: up{job="video-detector",instance="one"}
        values: 1+0x7
      - series: up{job="video-detector",instance="two"}
        values: 0+0x7
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 2+0x7
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.video"}
        values: 0+0x3 1+0x3
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: video-detector, queue: analysis.video}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
      - eval_time: 4m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: idle queues and brief consumer reconnects stay quiet
    interval: 1m
    input_series:
      - series: up{job="video-detector"}
        values: 1+0x5
      - series: up{job="audio-detector"}
        values: 1+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.video"}
        values: 0+0x5
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 2+0x5
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.video"}
        values: 0+0x5
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.audio"}
        values: 1 0 1+0x3
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: DetectorUnavailable
        exp_alerts: []
  - name: consumers do not hide absent detector HTTP targets
    interval: 1m
    input_series:
      - series: rabbitmq_queue_messages_ready{job="rabbitmq",queue="analysis.audio"}
        values: 2+0x5
      - series: rabbitmq_queue_consumers{job="rabbitmq",queue="analysis.audio"}
        values: 1+0x5
    alert_rule_test:
      - eval_time: 2m
        alertname: DetectorUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: audio-detector, queue: analysis.audio}
            exp_annotations: {summary: Brak dostępnego detektora dla oczekujących zadań.}
